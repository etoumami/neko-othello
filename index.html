<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>猫オセロ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: felt board as the hero on the left, a slim scorecard + move record on the right; stacks on phones */
:root {
  --bg: #eaefe9;
  --fg: #1b2420;
  --muted: #5a6a61;
  --panel: #f8faf7;
  --line: #cdd8cf;
  --felt: #1e6a45;
  --felt-edge: #0f3b27;
  --felt-line: rgba(0, 0, 0, .28);
  --brass: #a87a22;
  --hint: rgba(255, 255, 255, .28);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --fg: #e3eae5; --muted: #93a39a; --panel: #18211c; --line: #2a3730;
    --felt: #1b5e3d; --felt-edge: #08241a; --felt-line: rgba(0, 0, 0, .38); --brass: #d3a548;
    --hint: rgba(255, 255, 255, .22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --fg: #e3eae5; --muted: #93a39a; --panel: #18211c; --line: #2a3730;
  --felt: #1b5e3d; --felt-edge: #08241a; --felt-line: rgba(0, 0, 0, .38); --brass: #d3a548;
  --hint: rgba(255, 255, 255, .22); color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; padding-block: 24px 40px;
}
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: .04em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: .9rem; }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; }
@media (max-width: 760px) { .game { grid-template-columns: minmax(0, 1fr); } }

/* Board */
.board-frame {
  background: var(--felt-edge); border-radius: 10px; padding: 6px 6px 6px 6px;
  width: 100%; max-width: 560px; justify-self: center;
  display: grid; grid-template-columns: 22px 1fr; grid-template-rows: 22px 1fr; gap: 4px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.cols, .rows { display: grid; font-family: var(--font-mono); font-size: .72rem; color: rgba(255,255,255,.6); }
.cols { grid-column: 2; grid-template-columns: repeat(8, 1fr); text-align: center; align-items: end; }
.rows { grid-row: 2; grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: center; }
.board {
  grid-column: 2; grid-row: 2; aspect-ratio: 1; max-width: 100%;
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
  background: var(--felt); position: relative;
  border: 1px solid var(--felt-line);
}
.cell {
  appearance: none; border: 0; margin: 0; padding: 0; background: transparent; cursor: default;
  border-right: 1px solid var(--felt-line); border-bottom: 1px solid var(--felt-line);
  position: relative; display: grid; place-items: center;
}
.cell:nth-child(8n) { border-right: 0; }
.cell:nth-last-child(-n+8) { border-bottom: 0; }
.cell.can { cursor: pointer; }
.cell.can::after {
  content: ""; width: 26%; aspect-ratio: 1; border-radius: 50%; background: var(--hint);
}
.cell.can:hover::after { width: 80%; opacity: .6; }
.cell:focus-visible { outline: 3px solid var(--brass); outline-offset: -3px; z-index: 1; }
/* star points at the corners of the centre 4x4 */
.dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--felt-line); transform: translate(-50%, -50%); pointer-events: none; }

/* Each disc face is a cat curled up asleep: black cat on the black side, white cat on the white side.
   The pictures fill almost the whole square; the shadow follows the cat's outline, ear included */
.disc { width: 82%; aspect-ratio: 1; background-size: contain; background-position: center; background-repeat: no-repeat; }
.disc.b { background-image: var(--cat-b); filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.disc.w { background-image: var(--cat-w); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.disc.new { animation: drop .22s ease-out; }
.disc.flip.b { animation: flipToB .42s ease-in-out; }
.disc.flip.w { animation: flipToW .42s ease-in-out; }
.cell.last::before {
  content: ""; position: absolute; top: 7%; right: 7%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: #d6453a; z-index: 1;
}
@keyframes drop { from { transform: scale(.4); opacity: .3; } to { transform: scale(1); opacity: 1; } }
/* The old cat shows until the disc is edge-on, then the new cat turns into view */
@keyframes flipToB {
  0% { transform: scaleX(1); background-image: var(--cat-w); }
  49% { transform: scaleX(.04); background-image: var(--cat-w); }
  51% { transform: scaleX(.04); background-image: var(--cat-b); }
  100% { transform: scaleX(1); background-image: var(--cat-b); }
}
@keyframes flipToW {
  0% { transform: scaleX(1); background-image: var(--cat-b); }
  49% { transform: scaleX(.04); background-image: var(--cat-b); }
  51% { transform: scaleX(.04); background-image: var(--cat-w); }
  100% { transform: scaleX(1); background-image: var(--cat-w); }
}
@media (prefers-reduced-motion: reduce) { .disc.new, .disc.flip { animation: none; } }

/* Side panel */
aside { display: grid; gap: 16px; min-width: 0; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; display: grid; gap: 2px;
}
.side.active { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.side .who { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.side .who .disc { width: 16px; }
.side .n { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.status {
  min-height: 3.2em; font-weight: 500; padding: 10px 12px; border-left: 3px solid var(--brass);
  background: var(--panel);
}
.controls { display: grid; gap: 10px; }
.label { font-size: .75rem; color: var(--muted); letter-spacing: .08em; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg.seg-3 { grid-template-columns: 1fr 1fr 1fr; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button.btn, .seg button {
  font: inherit; font-size: .9rem; padding: 8px 10px; cursor: pointer;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
}
button.btn:hover, .seg button:hover { border-color: var(--brass); }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; }
.check { display: flex; align-items: center; gap: 8px; font-size: .88rem; }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.log ol {
  margin: 6px 0 0; padding: 0; list-style: none; max-height: 160px; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 2px 8px;
  font-family: var(--font-mono); font-size: .82rem; font-variant-numeric: tabular-nums;
}
.log li { display: flex; gap: 6px; align-items: center; }
.log li .i { color: var(--muted); min-width: 2ch; text-align: right; }
.log li .disc { width: 10px; }
.log .empty { color: var(--muted); font-size: .85rem; font-family: var(--font-body); grid-column: 1 / -1; }

.hint { margin: 0; font-size: .8rem; color: var(--muted); line-height: 1.5; }

/* Match record */
.rec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkbtn {
  font: inherit; font-size: .75rem; color: var(--muted); background: none; border: 0; padding: 2px 0;
  text-decoration: underline; cursor: pointer;
}
.linkbtn.armed { color: #c0392b; font-weight: 700; }
.tally { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .82rem; font-variant-numeric: tabular-nums; }
.tally th, .tally td { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.tally th:first-child, .tally td:first-child { text-align: left; }
.tally thead th { font-weight: 500; color: var(--muted); font-size: .72rem; }
.log ol.recent {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; margin-top: 8px; max-height: 150px;
  font-family: var(--font-body); font-size: .8rem;
}
.recent li { display: flex; gap: 8px; align-items: baseline; }
.recent .when { color: var(--muted); font-family: var(--font-mono); font-size: .75rem; min-width: 9ch; }
.recent .res { font-weight: 700; }
.recent .res.win { color: var(--brass); }
.recent .sc { margin-left: auto; font-family: var(--font-mono); font-size: .75rem; }

.rules { color: var(--muted); font-size: .85rem; max-width: 65ch; }
.rules summary { cursor: pointer; color: var(--fg); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>猫オセロ</h1>
    <p>黒が先手です。白い点のマスに石を置けます。</p>
  </header>

  <div class="game">
    <div class="board-frame">
      <div class="cols" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
      <div class="rows" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span></div>
      <div class="board" id="board" role="grid" aria-label="オセロの盤面"></div>
    </div>

    <aside>
      <div class="score">
        <div class="side" id="side-b"><span class="who"><span class="disc b"></span><span id="name-b">黒（あなた）</span></span><span class="n" id="count-b">2</span></div>
        <div class="side" id="side-w"><span class="who"><span class="disc w"></span><span id="name-w">白（コンピュータ）</span></span><span class="n" id="count-w">2</span></div>
      </div>

      <div class="status" id="status" aria-live="polite"></div>

      <div class="controls">
        <span class="label">対戦相手</span>
        <div class="seg" role="group" aria-label="対戦相手">
          <button id="mode-cpu" aria-pressed="true">コンピュータ</button>
          <button id="mode-pvp" aria-pressed="false">2人で対戦</button>
        </div>
        <div class="controls" id="level-box">
          <span class="label">コンピュータの強さ</span>
          <div class="seg seg-3" role="group" aria-label="コンピュータの強さ">
            <button id="level-easy" aria-pressed="false">よわい</button>
            <button id="level-normal" aria-pressed="true">ふつう</button>
            <button id="level-hard" aria-pressed="false">つよい</button>
          </div>
          <p class="hint" id="level-hint"></p>
        </div>
        <label class="check"><input type="checkbox" id="hints" checked> 置ける場所を表示する</label>
        <label class="check"><input type="checkbox" id="sound" checked> 効果音を鳴らす</label>
        <div class="row">
          <button class="btn" id="undo">1手戻す</button>
          <button class="btn" id="reset">最初から</button>
        </div>
      </div>

      <div class="log">
        <span class="label">棋譜</span>
        <ol id="log"></ol>
      </div>

      <div class="log">
        <div class="rec-head">
          <span class="label">対戦記録</span>
          <button class="linkbtn" id="rec-clear">記録を消す</button>
        </div>
        <table class="tally" aria-label="コンピュータとの対戦成績">
          <thead><tr><th>相手</th><th>勝ち</th><th>負け</th><th>引き分け</th></tr></thead>
          <tbody id="tally"></tbody>
        </table>
        <ol class="recent" id="recent"></ol>
        <p class="hint">記録はこのスマホ・パソコンのブラウザの中だけに保存されます。</p>
      </div>
    </aside>
  </div>

  <details class="rules">
    <summary>ルール</summary>
    <p>自分の石で相手の石をはさむと、はさんだ石が自分の色に変わります。縦・横・斜めのどの方向でもはさめます。相手の石を1つもはさめないマスには置けません。置ける場所がないときは自動でパスになり、両者とも置けなくなったら終了です。石が多いほうの勝ちです。</p>
  </details>
</div>

          const d = buf.getChannelData(0);
          let peak = 0;
          for (let i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
          const th = peak * 0.03;
          let s = 0, e = d.length - 1;
          while (s < e && Math.abs(d[s]) < th) s++;
          while (e > s && Math.abs(d[e]) < th) e--;
          sample.start = Math.max(0, s / buf.sampleRate - 0.01);
          sample.len = Math.min(buf.duration - sample.start, (e - s) / buf.sampleRate + 0.05);
          sample.buf = buf;
        }, () => {});
      } catch (e) { /* falls back to the synthesised meow */ }
    }
    // Plays the recording at the given speed (lower = deeper voice). maxLen cuts it short with a quick
    // fade, for the light "nya". Returns how long it sounds in seconds, or 0 if the recording isn't ready
    function playCat(at, rate, maxLen) {
      const a = audio(); if (!a || !sample.buf) return 0;
      const t = a.currentTime + at;
      const len = maxLen ? Math.min(maxLen, sample.len) : sample.len;
      const real = len / rate;
      const src = a.createBufferSource(), g = a.createGain();
      src.buffer = sample.buf;
      src.playbackRate.value = rate;
      g.gain.setValueAtTime(1, t);
      if (maxLen && maxLen < sample.len) {
        g.gain.setValueAtTime(1, t + Math.max(0, real - 0.05));
        g.gain.linearRampToValueAtTime(0.0001, t + real);
      }
      src.connect(g).connect(master);
      src.start(t, sample.start, len);
      return real;
    }
    // Black cat a little deeper, white cat a little higher, with a touch of variation each time
    const voice = p => (p === B ? 0.88 : 1.12) * (0.96 + Math.random() * 0.08);
    // One short tone whose pitch slides from f1 to f2 and fades out
    function tone(at, type, f1, f2, dur, vol) {
      const a = audio(); if (!a) return;
      const t = a.currentTime + at;
      const osc = a.createOscillator(), g = a.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f1, t);
      osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(master);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // A synthesised meow. base sets the cat's voice pitch in Hz; dur is its length in seconds
    // (short for the light "nya" on placing, longer for the drawn-out "nyaa" on flipping).
    //
    // How it is built, following what a real meow does:
    //  - voice: a throat-like buzz (harmonics fading with height) plus a little breath noise
    //  - pitch: a smooth arch that rises, peaks a little past the middle, then sags at the end,
    //    with a slight wobble and random variation so no two meows match
    //  - mouth: three vowel filters move from closed and nasal ("n/m"), open wide ("a"),
    //    then close again ("o/u"), which is the m-ya-o shape of a real meow
    let master = null, voiceWave = null, noiseBuf = null;
    function setup(a) {
      if (master) return;
      const comp = a.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = a.createGain(); master.gain.value = 0.5;
      master.connect(comp).connect(a.destination);
      const N = 48, real = new Float32Array(N), imag = new Float32Array(N);
      for (let k = 1; k < N; k++) imag[k] = 1 / Math.pow(k, 1.15);
      voiceWave = a.createPeriodicWave(real, imag);
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    // A smooth curve for setValueCurveAtTime: fn maps 0..1 to a value
    const curve = (fn, n = 48) => Float32Array.from({ length: n }, (_, i) => fn(i / (n - 1)));

    function nya(at, base, dur = 0.3) {
      const a = audio(); if (!a) return;
      setup(a);
      const t = a.currentTime + at + 0.01;
      dur *= 0.9 + Math.random() * 0.2;
      const f0 = base * (0.92 + Math.random() * 0.16);
      const peak = 0.4 + Math.random() * 0.15;          // where in the meow the pitch tops out
      const arch = x => x < peak ? Math.sin((x / peak) * Math.PI / 2) : Math.cos(((x - peak) / (1 - peak)) * Math.PI / 2);

      // Voice
      const src = a.createOscillator();
      src.setPeriodicWave(voiceWave);
      src.frequency.setValueCurveAtTime(curve(x => f0 * (0.8 + 0.42 * arch(x) - 0.1 * x)), t, dur);
      const lfo = a.createOscillator(), lfoGain = a.createGain();
      lfo.frequency.value = 5 + Math.random() * 2; lfoGain.gain.value = f0 * 0.015;
      lfo.connect(lfoGain).connect(src.frequency);

      // Breath
      const noise = a.createBufferSource(), noiseHp = a.createBiquadFilter(), noiseGain = a.createGain();
      noise.buffer = noiseBuf; noise.loop = true;
      noiseHp.type = "highpass"; noiseHp.frequency.value = 1500;
      noiseGain.gain.value = 0.12;
      noise.connect(noiseHp).connect(noiseGain);

      const mix = a.createGain();
      src.connect(mix); noiseGain.connect(mix);

      // Mouth: closed -> open "a" -> rounding "o/u"
      const open = x => x < peak ? Math.sin((x / peak) * Math.PI / 2) : 1 - 0.55 * ((x - peak) / (1 - peak));
      const out = a.createGain();
      [
        [450, 1150, 5, 1.0],    // F1 rises as the jaw opens
        [1900, 1500, 7, 0.55],  // F2 falls from "ya" toward "o"
        [3300, 3000, 9, 0.22],  // F3 adds the bright, catty edge
      ].forEach(([closed, wide, q, level]) => {
        const f = a.createBiquadFilter(), g = a.createGain();
        f.type = "bandpass"; f.Q.value = q;
        f.frequency.setValueCurveAtTime(curve(x => closed + (wide - closed) * open(x)), t, dur);
        g.gain.value = level * 3;
        mix.connect(f).connect(g).connect(out);
      });
      // A little low, nasal body underneath, strongest at the start
      const nasal = a.createBiquadFilter(), nasalGain = a.createGain();
      nasal.type = "lowpass"; nasal.frequency.value = 900;
      nasalGain.gain.setValueCurveAtTime(curve(x => 0.5 * (1 - x) + 0.05), t, dur);
      mix.connect(nasal).connect(nasalGain).connect(out);

      // Loudness: soft start, swells as the mouth opens, fades as it closes
      out.gain.setValueCurveAtTime(curve(x => {
        const attack = Math.min(1, x / 0.12);
        const swell = 0.35 + 0.65 * Math.sin(Math.min(1, x / (peak + 0.1)) * Math.PI / 2);
        const release = x > 0.7 ? Math.cos(((x - 0.7) / 0.3) * Math.PI / 2) : 1;
        return 0.35 * attack * swell * release;
      }), t, dur);
      out.connect(master);

      [src, lfo, noise].forEach(node => { node.start(t); node.stop(t + dur + 0.02); });
    }

    return {
      unlock() { if (on()) wake(); },
      // A light "nya" as the disc lands: the black cat a little lower, the white cat a little higher
      // (Uses the recording; the synthesised meow stands in if it hasn't finished loading.)
      place(p) {
        if (!on()) return;
        if (!playCat(0, voice(p), 0.18)) nya(0, p === B ? 560 : 720, 0.18);
      },
      // One full meow for each disc turned over, in the voice of the cat it turned into.
      // Returns how many seconds the chorus lasts, so the computer can wait for it to finish
      flips(n, p) {
        if (!on() || !n) return 0;
        n = Math.min(n, 3);   // never more than three meows, however many discs turn
        if (sample.buf) {
          const one = sample.len / (p === B ? 0.88 : 1.12);
          const gap = Math.max(0.35, Math.min(one * 0.8, 0.6));
          let endAt = 0;
          for (let i = 0; i < n; i++) endAt = Math.max(endAt, 0.3 + i * gap + playCat(0.3 + i * gap, voice(p)));
          return endAt;
        }
        const base = p === B ? 520 : 680, gap = 0.42, dur = 0.55;
        for (let i = 0; i < n; i++) nya(0.3 + i * gap, base, dur);
        return 0.3 + (n - 1) * gap + dur * 1.1;
      },
      // after: seconds to wait so these play once the meowing has finished
      pass(after = 0) {
        if (!on()) return;
        tone(after + 0.1, "sine", 520, 380, 0.18, 0.15);
      },
      // A short rising chime when the game ends
      end(after = 0) {
        if (!on()) return;
        [523, 659, 784, 1047].forEach((f, i) => tone(after + 0.2 + i * 0.12, "triangle", f, f, 0.35, 0.18));
      },
    };
  })();

  let state, cpuTimer = null, anim = { placed: null, flipped: [] };

  function initial(mode) {
    const board = Array.from({ length: 8 }, () => Array(8).fill(EMPTY));
    board[3][3] = W; board[4][4] = W; board[3][4] = B; board[4][3] = B;
    return { board, turn: B, mode, log: [], history: [], over: false, note: "", last: null };
  }

  const opp = p => (p === B ? W : B);
  const inside = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;

  function flipsFor(board, r, c, p) {
    if (board[r][c] !== EMPTY) return [];
    const out = [];
    for (const [dr, dc] of DIRS) {
      const line = [];
      let y = r + dr, x = c + dc;
      while (inside(y, x) && board[y][x] === opp(p)) { line.push([y, x]); y += dr; x += dc; }
      if (line.length && inside(y, x) && board[y][x] === p) out.push(...line);
    }
    return out;
  }

  function legalMoves(board, p) {
    const list = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const f = flipsFor(board, r, c, p);
      if (f.length) list.push({ r, c, flips: f });
    }
    return list;
  }

  function count(board) {
    let b = 0, w = 0;
    for (const row of board) for (const v of row) { if (v === B) b++; else if (v === W) w++; }
    return { b, w };
  }

  const name = p => p === B ? "黒" : "白";
  const isCpuTurn = () => state.mode === "cpu" && state.turn === W && !state.over;

  function play(r, c) {
    const flips = flipsFor(state.board, r, c, state.turn);
    if (!flips.length || state.over) return;
    state.history.push(JSON.stringify({ board: state.board, turn: state.turn, log: state.log, note: state.note, last: state.last }));
    const p = state.turn;
    state.board[r][c] = p;
    for (const [y, x] of flips) state.board[y][x] = p;
    state.log.push({ p, sq: COLS[c] + (r + 1) });
    state.last = [r, c];
    anim = { placed: [r, c], flipped: flips };

    state.note = "";
    const next = opp(p);
    if (legalMoves(state.board, next).length) {
      state.turn = next;
    } else if (legalMoves(state.board, p).length) {
      state.note = `${name(next)}は置ける場所がないのでパスです。`;
      state.log.push({ p: next, sq: "パス" });
    } else {
      state.over = true;
      recordGame();
    }
    render();
    sound.place(p);
    const chorus = sound.flips(flips.length, p);
    if (state.note) sound.pass(chorus);
    if (state.over) sound.end(chorus);
    scheduleCpu(chorus);
  }

  // Computer strength, chosen by the player and remembered between visits. Starts at ふつう
  let level = "normal";
  const LEVEL_NAME = { easy: "よわい", normal: "ふつう", hard: "つよい" };
  const LEVEL_HINT = {
    easy: "よわい：ほとんど思いつきで打ちます。はじめての人や子ども向け。",
    normal: "ふつう：作戦を考えて打ちますが、ときどきうっかりミスをします。",
    hard: "つよい：角を取り、角の隣を避け、相手の打てる場所を減らすように打ちます。",
  };

  // Match record: finished games are kept in this browser only (most recent first, up to 100)
  const REC_KEY = "othello-records";
  function loadRecords() {
    try { const r = JSON.parse(localStorage.getItem(REC_KEY) || "[]"); return Array.isArray(r) ? r : []; } catch (e) { return []; }
  }
  let records = loadRecords();
  function saveRecords() {
    try { localStorage.setItem(REC_KEY, JSON.stringify(records)); } catch (e) {}
  }
  // Called once when a game ends; undoing after the end and finishing again does not count twice
  function recordGame() {
    if (state.recorded) return;
    state.recorded = true;
    const { b, w } = count(state.board);
    records.unshift({ t: Date.now(), mode: state.mode, level: state.mode === "cpu" ? level : null, b, w });
    records = records.slice(0, 100);
    saveRecords();
  }
  function resultOf(r) {
    if (r.b === r.w) return { text: "引き分け", cls: "" };
    if (r.mode === "cpu") return r.b > r.w ? { text: "勝ち", cls: "win" } : { text: "負け", cls: "" };
    return { text: (r.b > r.w ? "黒" : "白") + "の勝ち", cls: "" };
  }
  function renderRecords() {
    const tally = $("tally");
    tally.textContent = "";
    for (const l of ["easy", "normal", "hard"]) {
      const games = records.filter(r => r.mode === "cpu" && r.level === l);
      const win = games.filter(r => r.b > r.w).length, lose = games.filter(r => r.b < r.w).length;
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${LEVEL_NAME[l]}</td><td>${win}</td><td>${lose}</td><td>${games.length - win - lose}</td>`;
      tally.appendChild(tr);
    }
    const list = $("recent");
    list.textContent = "";
    if (!records.length) {
      const li = document.createElement("li");
      li.className = "hint";
      li.textContent = "まだ記録はありません。1局終わるとここに残ります。";
      list.appendChild(li);
    }
    for (const r of records.slice(0, 20)) {
      const d = new Date(r.t), res = resultOf(r);
      const when = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      const who = r.mode === "cpu" ? LEVEL_NAME[r.level] || "" : "2人";
      const li = document.createElement("li");
      li.innerHTML = `<span class="when">${when}</span><span>${who}</span><span class="res ${res.cls}">${res.text}</span><span class="sc">${r.b}-${r.w}</span>`;
      list.appendChild(li);
    }
  }
  try { const saved = localStorage.getItem("othello-level"); if (["easy", "normal", "hard"].includes(saved)) level = saved; } catch (e) {}

  function cpuMove() {
    const moves = legalMoves(state.board, W);
    if (!moves.length) return;
    // よわい: plays almost at random, sometimes simply grabbing the most discs
    if (level === "easy") {
      const pick = Math.random() < 0.3
        ? moves.reduce((a, b) => (b.flips.length > a.flips.length ? b : a))
        : moves[Math.floor(Math.random() * moves.length)];
      play(pick.r, pick.c);
      return;
    }
    // ふつう: uses the same plan as つよい but with a lot of guesswork mixed in, so it slips up now and then
    const noise = level === "normal" ? 45 : 1;
    let best = null, bestScore = -Infinity;
    for (const m of moves) {
      // Simulate, then penalise moves that hand the opponent a corner and reward limiting their options
      const copy = state.board.map(row => row.slice());
      copy[m.r][m.c] = W;
      for (const [y, x] of m.flips) copy[y][x] = W;
      const theirs = legalMoves(copy, B);
      const givesCorner = theirs.some(t => WEIGHT[t.r][t.c] === 100);
      const score = WEIGHT[m.r][m.c] + m.flips.length * 0.5 - theirs.length * 1.5 - (givesCorner ? 40 : 0) + Math.random() * noise;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    play(best.r, best.c);
  }

  // wait: extra seconds to let the previous move's meowing finish before the computer plays
  function scheduleCpu(wait = 0) {
    clearTimeout(cpuTimer);
    // A beat of quiet after the meowing ends, so the computer seems to stop and think
    if (isCpuTurn()) cpuTimer = setTimeout(cpuMove, Math.max(1200, wait * 1000 + 900));
  }

  function undo() {
    clearTimeout(cpuTimer);
    if (!state.history.length) return;
    // Against the computer, step back to the last position where it was the player's turn
    do {
      const prev = JSON.parse(state.history.pop());
      Object.assign(state, prev, { over: false });
    } while (state.mode === "cpu" && state.turn === W && state.history.length);
    anim = { placed: null, flipped: [] };
    render();
    scheduleCpu();
  }

  function reset(mode) {
    clearTimeout(cpuTimer);
    state = initial(mode || state.mode);
    anim = { placed: null, flipped: [] };
    render();
  }

  function render() {
    const showHints = $("hints").checked;
    const moves = state.over || isCpuTurn() ? [] : legalMoves(state.board, state.turn);
    const canSet = new Set(moves.map(m => m.r * 8 + m.c));
    const flipSet = new Set(anim.flipped.map(([y, x]) => y * 8 + x));

    boardEl.textContent = "";
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const v = state.board[r][c];
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.id = `sq-${COLS[c]}${r + 1}`;
      cell.setAttribute("role", "gridcell");
      const k = r * 8 + c;
      const label = COLS[c] + (r + 1);
      if (v) {
        const d = document.createElement("span");
        d.className = "disc " + (v === B ? "b" : "w");
        if (anim.placed && anim.placed[0] === r && anim.placed[1] === c) d.classList.add("new");
        else if (flipSet.has(k)) d.classList.add("flip");
        cell.appendChild(d);
        cell.setAttribute("aria-label", `${label} ${name(v)}`);
        cell.disabled = false; cell.tabIndex = -1;
      } else if (canSet.has(k)) {
        if (showHints) cell.classList.add("can"); else cell.style.cursor = "pointer";
        cell.setAttribute("aria-label", `${label} に置く`);
        cell.addEventListener("click", () => play(r, c));
      } else {
        cell.setAttribute("aria-label", `${label} 空き`);
        cell.tabIndex = -1;
      }
      if (state.last && state.last[0] === r && state.last[1] === c) cell.classList.add("last");
      boardEl.appendChild(cell);
    }
    for (const [r, c] of [[2,2],[2,6],[6,2],[6,6]]) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.top = (r / 8 * 100) + "%"; dot.style.left = (c / 8 * 100) + "%";
      boardEl.appendChild(dot);
    }
    anim = { placed: null, flipped: [] };

    const { b, w } = count(state.board);
    $("count-b").textContent = b; $("count-w").textContent = w;
    $("side-b").classList.toggle("active", !state.over && state.turn === B);
    $("side-w").classList.toggle("active", !state.over && state.turn === W);
    $("name-b").textContent = state.mode === "cpu" ? "黒（あなた）" : "黒";
    $("name-w").textContent = state.mode === "cpu" ? "白（コンピュータ）" : "白";

    let msg;
    if (state.over) {
      const result = b === w ? "引き分けです。" :
        state.mode === "cpu" ? (b > w ? "あなたの勝ちです！" : "コンピュータの勝ちです。") :
        `${b > w ? "黒" : "白"}の勝ちです！`;
      msg = `終了：${b} 対 ${w}。${result}`;
    } else if (isCpuTurn()) {
      msg = "コンピュータが考えています…";
    } else {
      msg = state.mode === "cpu" ? "あなた（黒）の番です。" : `${name(state.turn)}の番です。`;
    }
    $("status").textContent = (state.note ? state.note + " " : "") + msg;

    const logEl = $("log");
    logEl.textContent = "";
    if (!state.log.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "まだ1手も打っていません";
      logEl.appendChild(li);
    }
    state.log.forEach((m, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="i">${i + 1}</span><span class="disc ${m.p === B ? "b" : "w"}"></span><span>${m.sq}</span>`;
      logEl.appendChild(li);
    });
    logEl.scrollTop = logEl.scrollHeight;

    $("undo").disabled = !state.history.length;
    $("mode-cpu").setAttribute("aria-pressed", state.mode === "cpu");
    $("mode-pvp").setAttribute("aria-pressed", state.mode === "pvp");
    // Strength only matters against the computer
    $("level-box").hidden = state.mode !== "cpu";
    for (const l of ["easy", "normal", "hard"]) $("level-" + l).setAttribute("aria-pressed", level === l);
    $("level-hint").textContent = LEVEL_HINT[level];
    renderRecords();
  }

  $("undo").addEventListener("click", undo);
  $("reset").addEventListener("click", () => reset());
  $("hints").addEventListener("change", render);
  try { if (localStorage.getItem("othello-sound") === "off") $("sound").checked = false; } catch (e) {}
  $("sound").addEventListener("change", () => {
    try { localStorage.setItem("othello-sound", $("sound").checked ? "on" : "off"); } catch (e) {}
    sound.unlock();
  });
  // touchend and click count as a real tap on phones; pointerdown alone does not on iPhone
  ["pointerdown", "touchend", "click", "keydown"].forEach(type =>
    document.addEventListener(type, () => sound.unlock(), { capture: true, passive: true }));
  $("mode-cpu").addEventListener("click", () => { if (state.mode !== "cpu") reset("cpu"); });
  $("mode-pvp").addEventListener("click", () => { if (state.mode !== "pvp") reset("pvp"); });
  // Clearing asks for a second tap within a few seconds, so one stray tap can't wipe the record
  let clearTimer = null;
  $("rec-clear").addEventListener("click", () => {
    const btn = $("rec-clear");
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed");
      btn.textContent = "もう一度押すと消えます";
      clearTimeout(clearTimer);
      clearTimer = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "記録を消す"; }, 4000);
      return;
    }
    clearTimeout(clearTimer);
    records = [];
    saveRecords();
    btn.classList.remove("armed");
    btn.textContent = "記録を消す";
    renderRecords();
  });

  // Changing the strength takes effect from the computer's next move; the game in progress carries on
  for (const l of ["easy", "normal", "hard"]) {
    $("level-" + l).addEventListener("click", () => {
      level = l;
      try { localStorage.setItem("othello-level", l); } catch (e) {}
      render();
    });
  }

  function start(saved) {
    state = saved && saved.state ? saved.state : initial("cpu");
    render();
    scheduleCpu();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
